<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Scanit's app icon: an open book on a glass plate, a scan beam crossing it.
       Glassy round badge in the app's blue. Drawn for Scanit (s002). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ec8ff"/>
      <stop offset="0.55" stop-color="#1e88e5"/>
      <stop offset="1" stop-color="#0d3f8f"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcecfb"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff6ff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#7ff6ff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.85" stop-color="#7ff6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7ff6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9ff8ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#9ff8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="tileclip"><circle cx="64" cy="62" r="56"/></clipPath>
  </defs>

  <!-- the shadow under the tile -->
  <circle cx="64" cy="66" r="55" fill="#000" opacity="0.28" filter="url(#soft)"/>
  <!-- the tile -->
  <circle cx="64" cy="62" r="56" fill="url(#tile)"/>

  <g clip-path="url(#tileclip)">
   <g transform="translate(64 64) scale(0.8) translate(-64 -66)">
    <!-- the glass plate the book lies on -->
    <path d="M18 92 L110 92 L104 104 L24 104 Z" fill="#0a2f63" opacity="0.45"/>
    <rect x="18" y="88" width="92" height="5" rx="2.5" fill="#bfe6ff" opacity="0.55"/>

    <!-- the open book -->
    <path d="M63 40 C52 33 37 32 24 35 L24 86 C37 83 52 84 63 90 Z" fill="#0b3a78" opacity="0.35" transform="translate(1.5 2.5)"/>
    <path d="M65 40 C76 33 91 32 104 35 L104 86 C91 83 76 84 65 90 Z" fill="#0b3a78" opacity="0.35" transform="translate(1.5 2.5)"/>
    <path d="M63 40 C52 33 37 32 24 35 L24 86 C37 83 52 84 63 90 Z" fill="url(#page)"/>
    <path d="M65 40 C76 33 91 32 104 35 L104 86 C91 83 76 84 65 90 Z" fill="url(#page)"/>
    <path d="M63 40 L63 90 M65 40 L65 90" stroke="#9cc3ea" stroke-width="1.2"/>
    <!-- lines of text -->
    <g stroke="#7fa6cf" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
      <path d="M31 45 C40 43 49 43 57 46"/>
      <path d="M31 52 C40 50 49 50 57 53"/>
      <path d="M31 59 C40 57 49 57 57 60"/>
      <path d="M31 73 C40 71 49 71 57 74"/>
      <path d="M31 80 C38 78 44 78 50 80"/>
      <path d="M71 46 C79 43 88 43 97 45"/>
      <path d="M71 53 C79 50 88 50 97 52"/>
      <path d="M71 60 C79 57 88 57 97 59"/>
      <path d="M71 74 C79 71 88 71 97 73"/>
      <path d="M71 81 C77 78 84 78 90 79"/>
    </g>

    <!-- the scan beam -->
    <ellipse cx="64" cy="66" rx="52" ry="9" fill="url(#glow)"/>
    <rect x="14" y="64.2" width="100" height="3.6" rx="1.8" fill="url(#beam)"/>

   </g>
    <!-- glass: the gloss over the top half, a curved edge -->
    <path d="M8 6 H120 V50 C92 60 40 44 8 58 Z" fill="url(#gloss)"/>
  </g>

  <!-- the rim: light catching the edge -->
  <circle cx="64" cy="62" r="55.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
</svg>
